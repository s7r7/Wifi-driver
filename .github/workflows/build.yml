name: Build 8188eu.ko Fast

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space & Install Tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev python3 zip clang lld llvm

      - name: Clone Android 5.10 GKI Kernel Source (Commit 71f3aedc8b92)
        run: |
          mkdir -p ~/kernel && cd ~/kernel
          git init
          git remote add origin https://googlesource.com
          git fetch --depth=1 origin 71f3aedc8b92
          git checkout FETCH_HEAD

      - name: Prepare Kernel Headers & Config
        run: |
          cd ~/kernel
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          ./scripts/config --file out/.config --set-str LOCALVERSION "-android12-9-00006-g71f3aedc8b92-ab14427738"
          ./scripts/config --file out/.config -d LOCALVERSION_AUTO
          ./scripts/config --file out/.config -d LTO_CLANG_THIN
          ./scripts/config --file out/.config -d LTO_CLANG_FULL
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(nproc) modules_prepare

      - name: Clone & Build RTL8188EUS Driver
        run: |
          cd ~
          git clone --depth=1 https://github.com
          cd rtl8188eus
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' Makefile
          sed -i 's/CONFIG_PLATFORM_ARM64_GENERIC = n/CONFIG_PLATFORM_ARM64_GENERIC = y/g' Makefile
          sed -i 's/CONFIG_POWER_SAVING = y/CONFIG_POWER_SAVING = n/g' Makefile
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 KSRC=~/kernel/out -j$(nproc)

      - name: Upload 8188eu.ko
        uses: actions/upload-artifact@v4
        with:
          name: 8188eu-BRP-NX1-5.10.236
          path: ~/rtl8188eus/8188eu.ko
